<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>

<h2>Edit task</h2>

<form method="POST">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div style="color: red;">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <div>
        <label for="{{ form.name.id_for_label }}">Title:</label><br>
        {{ form.name }}
        {% if form.name.errors %}
            <div style="color: red;">
                {{ form.name.errors }}
            </div>
        {% endif %}
    </div>

    <br>

    <div>
        <label for="{{ form.is_completed.id_for_label }}">
            {{ form.is_completed }} Completed
        </label>
        {% if form.is_completed.errors %}
            <div style="color: red;">
                {{ form.is_completed.errors }}
            </div>
        {% endif %}
    </div>

    <br>

    <button type="submit">Save</button>
</form>

<br>

<a href="{% url 'list' %}">Back</a>

</body>
</html>
