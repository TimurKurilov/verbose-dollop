<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>

<h2>Edit task</h2>

<form method="POST">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div style="color: red;">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <div>
        <label for="id_name">Title:</label><br>
        {{ form.name }}
        {{ form.name.errors }}
    </div>

    <br>

    <button type="submit">Save</button>
</form>

<br>

<a href="{% url 'list' %}">Back</a>

</body>
</html>
